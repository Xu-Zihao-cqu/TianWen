<!doctype html>

<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小子，被骗了吧！ · 天问</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:#11151c;color:#f7f4e9;font-family:system-ui,"Microsoft YaHei",sans-serif;background-image:radial-gradient(circle at 20% 20%,#b7ed6320,transparent 40%)}main{max-width:760px;width:100%;position:relative}.label{color:#b7ed63;font:12px monospace;letter-spacing:3px}.ticket{position:relative;border:1px solid #ffffff25;border-radius:28px;padding:clamp(24px,6vw,60px);background:#ffffff05;box-shadow:12px 12px 0 #b7ed6310}.badge{display:inline-block;transform:rotate(-8deg);background:#b7ed63;color:#11151c;padding:8px 16px;font-weight:800;border-radius:6px}.face{font-size:80px;display:block;margin:24px 0 10px;animation:float 3s ease-in-out infinite}h1{font-size:clamp(32px,6vw,58px);letter-spacing:-2px;line-height:1.3;margin:18px 0}p{color:#abb5c3;line-height:1.9}strong{color:#f7f4e9}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}a,button{cursor:pointer;border:1px solid #ffffff30;border-radius:12px;padding:13px 20px;font:inherit;text-decoration:none;color:#f7f4e9;background:transparent}a{background:#b7ed63;color:#11151c;border-color:transparent}button:hover{border-color:#b7ed63;color:#b7ed63}.foot{margin-top:28px;font:11px monospace;letter-spacing:2px;color:#7c899a}#reply{min-height:3em;font-size:14px}.confetti{position:fixed;pointer-events:none;font-size:30px;animation:fall 1.2s ease-in forwards}@keyframes float{50%{transform:translateY(-10px) rotate(7deg)}}@keyframes fall{to{transform:translateY(70vh) rotate(300deg);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:focus-visible{outline:3px solid #b7ed63;outline-offset:5px}

const messages=['好吧，你赢了。奖励你一朵电子小花 🌼','再找找，说不定隔壁卡片有真货！','你已成功下载：作者的调皮。','别点啦，空气库存也快没了！'];let count=0;
