<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>Multi-Mode Intelligent Car</title>
  <desc>Technical illustration of an STM32 intelligent car with line tracking, ultrasonic sensing, and Bluetooth control.</desc>
