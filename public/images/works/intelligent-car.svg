    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#24505a"/><stop offset="1" stop-color="#0a1723"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#67e8f9" stroke-opacity=".055"/></pattern>
  </defs>
