    <text x="250" y="224" fill="#67e8f9" stroke="none" font-family="Arial,sans-serif" font-size="13" letter-spacing="4" text-anchor="middle">F103C8T6</text>
    <circle cx="91" cy="310" r="61" fill="#09131d"/><circle cx="408" cy="310" r="61" fill="#09131d"/>
    <circle cx="91" cy="310" r="26" fill="#183847" stroke-opacity=".5"/><circle cx="408" cy="310" r="26" fill="#183847" stroke-opacity=".5"/>
    <g transform="translate(190 41)"><rect width="120" height="72" rx="18" fill="#0b202a" stroke-opacity=".6"/><circle cx="35" cy="36" r="19" fill="#102f3a"/><circle cx="85" cy="36" r="19" fill="#102f3a"/></g>
