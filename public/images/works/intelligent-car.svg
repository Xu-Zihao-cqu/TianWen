  <g fill="none" stroke="#67e8f9"><circle cx="600" cy="352" r="225" opacity=".09"/><circle cx="600" cy="352" r="285" opacity=".045"/><path d="M0 365h256l90-64h108M746 302h112l92 63h250" opacity=".26" stroke-width="2"/></g>
